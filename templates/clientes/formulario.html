{% extends 'base.html' %}{% block content %}
<div class="action-header"><div><p class="brand-kicker">🤝 Atención al cliente</p><h1 class="page-title">{% if cliente %}Editar cliente{% else %}Nuevo cliente{% endif %}</h1></div><a class="btn btn-outline-sabor" href="{% url 'productos:clientes_lista' %}">Volver</a></div>
<div class="card form-card"><div class="card-body p-4"><form method="post">{% csrf_token %}{{ form.non_field_errors }}<div class="row g-3">{% for campo in form %}<div class="col-md-6"><label for="{{ campo.id_for_label }}" class="form-label">{{ campo.label }}</label>{{ campo }}<div class="text-danger small">{{ campo.errors }}</div></div>{% endfor %}</div><button class="btn btn-sabor mt-4" type="submit">💾 Guardar cliente</button></form></div></div>
{% endblock %}
