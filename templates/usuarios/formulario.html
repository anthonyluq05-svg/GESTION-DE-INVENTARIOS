{% extends 'base.html' %}{% block content %}<div class="action-header"><div><p class="brand-kicker">👤 Equipo de trabajo</p><h1 class="page-title">Nuevo usuario</h1><p class="section-lead">Asignar permisos mediante el rol</p></div><a class="btn btn-outline-sabor" href="{% url 'productos:usuarios_lista' %}">Volver</a></div>
<div class="card form-card"><div class="card-body p-4"><form method="post">{% csrf_token %}{{ form.non_field_errors }}<div class="row g-3">{% for campo in form %}<div class="col-md-6"><label class="form-label" for="{{ campo.id_for_label }}">{{ campo.label }}</label>{{ campo }}<div class="text-danger small">{{ campo.errors }}</div></div>{% endfor %}</div><button type="submit" class="btn btn-sabor mt-4">💾 Crear usuario</button></form></div></div>{% endblock %}
