{% extends 'base.html' %}{% block content %}<h1 class="page-title">🗑️ Eliminar categoría</h1><div class="card"><div class="card-body p-4"><p>¿Seguro que deseas eliminar la categoría <strong>{{ object.nombre }}</strong>?</p><p class="text-danger">Si tiene productos registrados, no podrá eliminarse. En ese caso desactívala desde Editar.</p><form method="post">{% csrf_token %}<button class="btn btn-danger" type="submit">🗑️ Confirmar eliminación</button> <a class="btn btn-outline-sabor" href="{% url 'productos:categorias' %}">Cancelar</a></form></div></div>{% endblock %}
