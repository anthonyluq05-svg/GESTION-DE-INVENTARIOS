{% extends 'base.html' %}{% block content %}<h1 class="page-title">🗑️ Eliminar proveedor</h1><div class="card"><div class="card-body p-4"><p>¿Seguro que deseas eliminar a <strong>{{ proveedor.nombre }}</strong>?</p><p class="text-danger">Si tiene compras registradas, no podrá eliminarse. En ese caso desactívalo desde Editar.</p><form method="post">{% csrf_token %}<button class="btn btn-danger" type="submit">🗑️ Confirmar eliminación</button> <a class="btn btn-outline-sabor" href="{% url 'compras:proveedores' %}">Cancelar</a></form></div></div>{% endblock %}
