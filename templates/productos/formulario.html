{% extends 'base.html' %}

{% block content %}

<h2>Registrar / Editar producto</h2>

<form method="post">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit" class="btn btn-success">
        Guardar
    </button>

    <a href="{% url 'productos:lista' %}" class="btn btn-secondary">
        Cancelar
    </a>
</form>

{% endblock %}
